<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>400 Bad Request | BUILD+</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/admin_theme.css">
    <script src="/static/js/theme_switcher.js"></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--admin-bg-body, #F4F6F9);
            font-family: 'Inter', sans-serif;
            margin: 0;
        }
        .error-card {
            background-color: var(--admin-bg-surface, #FFFFFF);
            border: 1px solid var(--admin-border, #E2E8F0);
            border-radius: 16px;
            padding: 56px 48px;
            max-width: 540px;
            width: calc(100% - 32px);
            box-shadow: 0 4px 32px rgba(0,0,0,0.08);
            text-align: center;
        }
        .error-code {
            font-family: 'Manrope', sans-serif;
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1;
            color: var(--admin-brand-primary, #0B1F33);
            letter-spacing: -4px;
            margin-bottom: 8px;
        }
        .error-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
        }
        .error-title {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 1.35rem;
            color: var(--admin-text-primary, #0B1F33);
            margin-bottom: 12px;
        }
        .error-desc {
            color: var(--admin-text-secondary, #64748B);
            font-size: 0.9rem;
            margin-bottom: 32px;
            line-height: 1.65;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Manrope', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--admin-text-primary, #0B1F33);
            margin-bottom: 28px;
            text-decoration: none;
        }
        .brand-badge span { color: #C49A3A; }
        @media (max-width: 480px) {
            .error-card { padding: 40px 24px; }
            .error-code { font-size: 4rem; }
        }
    </style>
</head>
<body>
    <div class="error-card">
        <a href="/" class="brand-badge">BUILD<span>+</span></a>
        <div class="error-icon text-warning"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="error-code">400</div>
        <div class="error-title">Bad Request</div>
        <p class="error-desc">The server could not process your request. This is usually caused by an invalid or expired form submission. Please try again.</p>
        <div class="d-flex flex-wrap gap-2 justify-content-center">
            <a href="/" class="btn btn-primary px-4 fw-bold"><i class="bi bi-house me-1"></i> Return Home</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 fw-semibold">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
